<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="form.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1>Makaio's Web Design Page</h1>
    </header>
    <main>
        <div id="message"></div>
        <form action="processing.html" method="get" id="myform"> <!--google will use get: is used for search/filter/sort to retrieve data. the wont use post. post is used to send data.-->
            <fieldset>
                <legend>Account</legend>
                <div class="formrow">
                    <label for="fullname">Name:</label>
                    <input type="text" name="fullname" id="fullname" required>
                </div>
                <div class="formrow">
                    <label for="email">Email: </label>
                    <input type="email" name="email" id="email" placeholder="name@email.com">
                </div>
                <div class="formrow">
                    <label for="age">Age: </label>
                    <input type="number" name="age" id="age"><br>
                </div>
                <div class="formrow">
                    <label for="password">Password: </label>
                    <input type="password" name="pass" id="password">
                </div>
                <div class="checkrow">
                    <div class="spacer">Gender:</div>
                    <label><input type="radio" name="gender" value="male">Male</label>
                    <label><input type="radio" name="gender" value="female">Female</label>
                </div>
                <div class="checkrow">
                    <div class="spacer"></div>
                    <label><input type="checkbox" name="agree" value="on" checked>I agree to the terms.</label>
                </div>
                <div class="formrow">
                    <label for="state">States:</label>
                    <select name="state" id="state">
                    <option value="blank">-----</option>
                    <option value="CA">California</option>
                    <option value="HI">Hawaii</option>
                    <option value="UT">Utah</option>
                </select>
                </div>
                <div class="formrow">
                    <label for="comment">Comment:</label>
                    <textarea name="comment" id="comment"></textarea>
                </div>
                <div class="formrow">
                    <div class="spacer"></div>
                    <input type="submit" value="Submit!">
                </div>
            </fieldset>
        </form>
        <p>What is AJAX? Asynchronous JavaScript and  Json XML</p>
        <p>Why do you put your JS Code in a separate file? </p>
    </main>
     <footer>
        <p>&copy; 2026 Makaio Primacio</p>
        <p>Privacy Policy | Cookie Notice | Social Links| Jobs</p>
     </footer>
     <script src="form.js"></script>
</body>
</html>
