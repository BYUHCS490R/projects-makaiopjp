<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="finals.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1>Legendary Players</h1>
    </header>
    <nav>
        <a href="index.html">home</a>
        <a href="page1.html">history</a>
        <a href="page2.html">roster</a>
        <a href="page3.html">culture</a>
        <a href="page4.html">legendary players</a>
        <a href="page5.html" class="current5">feedback</a>
    </nav>
    <main>
        <div id="message"></div>
        <form action="processing.html" method="get" id="myform"> <!--google will use get: is used for search/filter/sort to retrieve data. the wont use post. post is used to send data.-->
            <fieldset>
                <legend>Feedback and Stories</legend>
                <div class="formrow">
                    <label for="fullname">Name:</label>
                    <input type="text" name="fullname" id="fullname" required placeholder="Ex: Last, First">
                </div>
                <div class="formrow">
                    <label for="email">Email: </label>
                    <input type="email" name="email" id="email" placeholder="name@email.com">
                </div>
                <div class="checkrow">
                    <div class="spacer">Gender:</div>
                    <label><input type="radio" name="gender" value="male">Male</label>
                    <label><input type="radio" name="gender" value="female">Female</label>
                </div>
                <div class="checkrow">
                    <div class="spacer"></div>
                    <label><input type="checkbox" name="agree" value="on" checked>I agree to the terms.</label>
                </div>
                <div class="formrow">
                    <label for="state">States:</label>
                    <select name="state" id="state">
                    <option value="blank">-----</option>
                    <option value="CA">California</option>
                    <option value="HI">Hawaii</option>
                    <option value="UT">Utah</option>
                </select>
                </div>
                <div class="formrow">
                    <label for="comment">Comment:</label>
                    <textarea name="comment" id="comment" placeholder="We'd love to hear your feedback, fan stories, and suggestions!"></textarea>
                </div>
                <div class="formrow">
                    <div class="spacer"></div>
                    <input type="submit" value="Submit!">
                </div>
            </fieldset>
        </form>
    </main>
     <footer>

     </footer>
     <script src="final.js"></script>
</body>
</html>
